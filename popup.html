<!DOCTYPE html>
<html>
<head>
  <title>Auto Refresh</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 250px; padding: 15px; text-align: center; color: #333; }
    h3 { margin-top: 0; color: #7c3aed; }
    input { width: 60px; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 15px; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 45%; }
    #startBtn { background-color: #7c3aed; color: white; }
    #stopBtn { background-color: #ef4444; color: white; }
    .status { margin-top: 15px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h3>Auto Refresh Plus</h3>
  <p>Refresh every:</p>
  <input type="number" id="interval" value="5" min="1"> <span> minutes</span>
  <br>
  <div>
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
  </div>
  <div class="status" id="statusText">Status: Inactive</div>
  <script src="popup.js"></script>
</body>
</html>
